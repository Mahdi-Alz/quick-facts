name: Keep Supabase alive

on:
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Like on Monday, unlike on Thursday
        env:
          URL: ${{ secrets.SUPABASE_URL }}/rest/v1/facts
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          H=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json")
          row=$(curl -fsS "${H[@]}" "$URL?select=id,votesInteresting&order=id&limit=1")
          id=$(jq -r '.[0].id' <<<"$row")
          n=$(jq -r '.[0].votesInteresting' <<<"$row")
          case "$(date -u +%u)" in
            1) next=$((n+1)) ;;
            4) next=$((n>0 ? n-1 : 0)) ;;
            *) next=$n ;;
          esac
          curl -fsS -o /dev/null -X PATCH "${H[@]}" "$URL?id=eq.$id" -d "{\"votesInteresting\": $next}"
